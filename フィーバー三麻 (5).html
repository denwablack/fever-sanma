<script>
const N=['1萬','7萬',...[1,2,3,4,5,6,7,8,9].map(n=>n+'筒'),...[1,2,3,4,5,6,7,8,9].map(n=>n+'索'),'東','南','西','北','白','發','中'];
const cl=t=>{t&=31;return t<2?'m':t<11?'p':t<20?'s':'z'};
const nx=i=>i==0?1:i==1?0:i<11?(i==10?2:i+1):i<20?(i==19?11:i+1):i<24?(i==23?20:i+1):(i==26?24:i+1);
const FEVER=1; // フィーバーリーチ成立時の加算翻
const FEVER_IDX=[1,8,17]; // 7萬・7筒・7索
const feverEligible=(hand,kans)=>{const c=cnt(hand);return FEVER_IDX.some(idx=>c[idx]+4*kans.filter(k=>(k[0]&31)==idx).length>=3)};
const feverOwner=()=>G.fev?G.fev.findIndex(x=>x):-1;
const feverLocked=p=>{const fo=feverOwner();return fo>=0&&fo!=p};
const $=id=>document.getElementById(id);
let RES=null,G={opt:{rep:false,dora:1}},msg='';let V=0,ROLE='solo',RM=null,PEND=false,SEATS={},LASTM=['',''],NICK='',CODE='',DMSG='',TMR=null;const st=(a,b)=>(a&31)-(b&31)||a-b;
const cnt=h=>{const c=Array(27).fill(0);h.forEach(t=>c[t&31]++);return c};
function mel(c,i){while(i<27&&!c[i])i++;if(i>=27)return true;
 if(c[i]>=3){c[i]-=3;const r=mel(c,i);c[i]+=3;if(r)return true}
 if((i>=2&&i<=8)||(i>=11&&i<=17)){if(c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const r=mel(c,i);c[i]++;c[i+1]++;c[i+2]++;if(r)return true}}
 return false}
const YC=[0,1,2,10,11,19,20,21,22,23,24,25,26];
function kokushi(c){return c.every((x,i)=>YC.includes(i)?x>=1:x==0)}
function chiitoi(c){let p=0,o=false;for(let i=0;i<27;i++){if(c[i]==2)p++;else if(c[i]!=0)o=true}return p==7&&!o}
function win(c){if(kokushi(c)||chiitoi(c))return true;for(let i=0;i<27;i++)if(c[i]>=2){c[i]-=2;const r=mel(c,0);c[i]+=2;if(r)return true}return false}
function waits(h){const c=cnt(h),w=[];for(let t=0;t<27;t++){if(c[t]>=4)continue;c[t]++;if(win(c))w.push(t);c[t]--}return w}
const without=(h,i)=>h.filter((_,k)=>k!=i);
const tenpaiDiscards=p=>G.pon[p].length?[]:G.h[p].map((_,i)=>i).filter(i=>G.pts[p]>=1000&&waits(without(G.h[p],i)).length>0);
const furiten=q=>!(G.opt.rep&&G.fev[q])&&waits(G.h[q]).some(t=>G.disc[q].some(d=>(d&31)==t));
const gl=t=>gl_(t&31);const gl_=t=>String.fromCodePoint(t==0?0x1F007:t==1?0x1F00D:t<11?0x1F019+t-2:t<20?0x1F010+t-11:t<24?0x1F000+t-20:t==24?0x1F006:t==25?0x1F005:0x1F004)+'\uFE0E';
const tiles=(a,f)=>a.map((t,i)=>{const k=t>>5;return `<span class="t ${cl(t)} ${['','rd','gd','pt'][k]}" data-t="${t}" ${f?`onclick="${f}(${i})"`:''}><i>${gl(t)}</i><b>${['','赤','金','ポ'][k]}${N[t&31]}</b></span>`}).join('');

function newHand(){
 const w=[];for(let t=0;t<27;t++)for(let k=0;k<4;k++)w.push(t+((t==6||t==15)?(k==0?32:k==1?64:0):t==24&&k<2?96:0));
 for(let i=w.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[w[i],w[j]]=[w[j],w[i]]}
 G.wall=w;G.ind=[];G.ura=[];for(let k=0;k<G.opt.dora;k++){G.ind.push(w.pop());G.ura.push(w.pop())}
 G.h=[0,1,2].map(()=>w.splice(0,13).sort(st));
 G.nuki=[[],[],[]];G.disc=[[],[],[]];G.rii=[0,0,0];G.fev=[0,0,0];G.ipp=[0,0,0];G.dbl=[0,0,0];G.kan=[[],[],[]];G.pon=[[],[],[]];G.called=false;G.rin=-1;G.dice=[0,0,0];G.wlog=[];RES=null;G.riiIdx=[-1,-1,-1];G.act=-1;G.stage='';G.turn=G.dealer;
 msg=`${roundLabel(G.hn)}${G.honba?G.honba+'本場':''} 親:${G.names[G.dealer]}`;start(G.turn)}
function start(p){
 if(G.wall.length<=14){return end(`流局（供託${G.pot}点持ち越し）`,true)}
 G.dmsg='';G.diceLog=[];const dt=G.wall.shift();G.h[p].push(dt);G.last=G.h[p].length-1;G.turn=p;
 if(feverLocked(p)){msg=`${G.names[p]}はフィーバー中のため強制ツモ切り`;G.stage='';G.act=-1;render('');setTimeout(()=>doDisc(p,G.last),450);return}
 if(G.rii[p]&&dt>>5==3){chance(p,1,'リーチ後の白ポッチツモ（オールマイティ）');return win_(p,-1)}
 if(G.hum[p]){if(G.rii[p])return riichiAuto(p);G.stage='me';G.act=p;draw()}else cpuTurn(p)}
function riichiAuto(p){
 while(true){const dt=G.h[p][G.last]&31;if(dt==0||dt==1||dt==23){pull(p,G.last);G.last=G.h[p].length-1;continue}break}
 if(canT(p,cnt(G.h[p])))return win_(p,-1);
 G.stage='me';G.act=p;render('');
 setTimeout(()=>doDisc(p,G.last),450)}
function pull(p,i){const t=G.h[p][i];G.h[p].splice(i,1);G.nuki[p].push(t);G.h[p].push(G.wall.pop());msg=`${G.names[p]}が${N[t]}を抜いた`}
function doraCount(p,c,L){let n=0;L.forEach(x=>{const d=nx(x&31);n+=c[d]+G.nuki[p].filter(y=>y==d).length});return n}
function tulipTargets(idx){
 if(idx>=2&&idx<=10){const off=idx-2;return [-1,0,1].map(d=>2+((off+d+9)%9))}
 if(idx>=11&&idx<=19){const off=idx-11;return [-1,0,1].map(d=>11+((off+d+9)%9))}
 if(idx==0||idx==1)return [0,1];
 if(idx>=20&&idx<=23){const off=idx-20;return [-1,0,1].map(d=>20+((off+d+4)%4))}
 if(idx>=24&&idx<=26)return [24,25,26];
 return [idx]}
function btns(){
 const p=V,c=cnt(G.h[p]||[]);let a='';
 if(G.stage=='me'&&G.act==p){
  if(G.kan[p].length<4)for(let t=0;t<27;t++)if(c[t]==4&&kanOK(p,t))a+=`<button class="g" onclick="U('kan',${t})">カン${N[t]}</button>`;
  if(canT(p,c))a+=`<button class="r" onclick="U('tsumo')">ツモ</button>`;
  if(!G.rii[p]){[0,23,1].forEach(t=>{if(c[t])a+=`<button class="g" onclick="U('nuki',${t})">${N[t]}抜き</button>`});
   if(tenpaiDiscards(p).length){a+=`<button onclick="togRii(1)">${(PEND==1||PEND==3)?'取消':(feverEligible(G.h[p],G.kan[p])?'🎰フィーバーリーチ':'リーチ')}${PEND==3?'+祝儀倍':''}</button>`;if(!G.used[p])a+=`<button class="r" onclick="togRii(2)">${PEND==2?'取消':'💰祝儀倍リーチ'}</button>`}}}
 if(G.stage=='pon'&&G.act==p)a=`<button class="r" onclick="U('pon',1)">ポン</button><button class="g" onclick="U('pon',0)">パス</button>`;
 if(G.stage=='ron'&&G.act==p)a=`<button class="r" onclick="U('ron',1)">ロン</button><button class="g" onclick="U('ron',0)">見送り</button>`;
 if(ROLE=='host'&&G.act>=0&&G.act!=p&&G.hum[G.act]&&G.stage!='done')a+=`<button class="g" onclick="takeover(${G.act})">${G.names[G.act]}をCPU代行にする</button>`;
 return a}
function draw(){render(btns())}
function togRii(m){PEND=PEND==m?false:m;draw()}
function U(n,x){if(ROLE=='guest'){if(RM)RM.emit('act',{a:n,x:x,p:PEND})}else act(V,n,x,PEND);PEND=false}
function act(s,n,x,pd){if(!G.hum||!G.hum[s])return;const f=AC[n];if(f)f(s,x|0,pd|0)}
function A_disc(s,i,pd){if(G.stage!='me'||G.act!=s||G.turn!=s||i<0||i>=G.h[s].length)return;if(G.rii[s]&&i!=G.last)return;
